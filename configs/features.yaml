# Feature detection configuration
# Swapping detector name here should require zero code changes in downstream modules.

detectors:
  sift:
    fast:  # Low-quality / high-speed preset
      nfeatures: 500
    thorough:  # High-quality preset
      nfeatures: 5000
      nOctaveLayers: 4
      contrastThreshold: 0.03

  orb:
    fast:
      nfeatures: 1000
    thorough:
      nfeatures: 5000
      scaleFactor: 1.2
      nlevels: 10

  akaze:
    fast:
      threshold: 0.001
    thorough:
      threshold: 0.0005
      octaves: 5
      octaveLayers: 4

# Default detector and preset
default_detector: sift
default_preset: fast
